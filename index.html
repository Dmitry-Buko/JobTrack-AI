<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JobTrack AI — управление поиском работы и подготовка к техническим собеседованиям с помощью ИИ" />
    <title>JobTrack AI</title>

    <!-- Иконки -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#007aff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a84ff" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / Twitter: карточка ссылки в мессенджерах и соцсетях -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JobTrack AI" />
    <meta property="og:title" content="JobTrack AI" />
    <meta property="og:description" content="Вакансии, отклики и AI-тренажёр собеседований в одном месте" />
    <!-- ЗАМЕНИТЕ домен на свой Netlify-адрес после первого деплоя -->
    <meta property="og:image" content="https://YOUR-NETLIFY-DOMAIN/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('jobtrack-theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage недоступен — остаётся светлая тема */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
