<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JobTrack AI — управление поиском работы и подготовка к техническим собеседованиям с помощью ИИ" />
    <title>JobTrack AI</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('jobtrack-theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage недоступен — остаётся светлая тема */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
